log_format sans_position '[$time_local] $request_method $uri $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=otlp:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=flux:10m;
limit_req_status 429;
limit_conn_status 429;
server {
 listen 80;
 root /usr/share/nginx/html;
 add_header X-Frame-Options "DENY" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://data.geopf.fr; object-src 'self' blob:; frame-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
 location / { try_files $uri $uri/ /index.html; }
 location ~ ^/api/(notifications/)?events$ {
  access_log /var/log/nginx/access.log sans_position;
  limit_conn flux 10;
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_read_timeout 150s;
 }
 location ~ ^/api/((login|register)$|compte/) {
  access_log /var/log/nginx/access.log sans_position;
  limit_req zone=auth burst=20 nodelay;
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_read_timeout 150s;
 }
 location /api/ {
  access_log /var/log/nginx/access.log sans_position;
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_read_timeout 150s;
 }
 location ~ ^/(oauth2|login/oauth2)/ {
  access_log /var/log/nginx/access.log sans_position;
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header Connection "";
 }
 location /otlp/ {
  limit_except POST { deny all; }
  client_max_body_size 256k;
  limit_req zone=otlp burst=40 nodelay;
  proxy_pass http://collector:4318/;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
 }
}
