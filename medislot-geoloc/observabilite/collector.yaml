receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    timeout: 2s
  attributes/sante:
    actions:
      - key: enduser.id
        action: delete
      - key: user.email
        action: delete
      - key: user.name
        action: delete
      - key: medislot.patient.email
        action: delete
      - key: medislot.patient.name
        action: delete
      - key: medislot.motif
        action: delete
  attributes/position:
    actions:
      - key: url.query
        action: delete
exporters:
  otlp_grpc:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/sante, attributes/position, batch]
      exporters: [otlp_grpc, debug]
