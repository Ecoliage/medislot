name: Construire une livraison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    uses: ./.github/workflows/ci.yml
  images:
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - run: |
          docker build -t medislot-backend:${{ github.sha }} backend
          docker build -t medislot-frontend:${{ github.sha }} frontend
          docker save medislot-backend:${{ github.sha }} medislot-frontend:${{ github.sha }} | gzip > images.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ github.sha }}
          path: images.tar.gz
