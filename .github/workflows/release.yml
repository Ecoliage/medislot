name: Construire une livraison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    uses: ./.github/workflows/ci.yml
  images:
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: |
          docker build -t medislot-backend:${{ github.sha }} backend
          docker build -t medislot-frontend:${{ github.sha }} frontend
          docker save medislot-backend:${{ github.sha }} medislot-frontend:${{ github.sha }} | gzip > images.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: images-${{ github.sha }}
          path: images.tar.gz
