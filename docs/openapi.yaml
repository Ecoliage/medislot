  "components": {
    "schemas": {
      "Professional": {
        "type": "object",
        "required": [
          "id",
          "name",
          "specialty",
          "city",
          "address",
          "bio",
          "fee"
        ],
        "properties": {
          "name": {
            "type": "string"
          },
          "specialty": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "address": {
            "type": "string"
          },
          "bio": {
            "type": "string"
          },
          "id": {
            "type": "integer",
            "format": "int64"
          },
          "fee": {
            "type": "integer",
            "minimum": 0
          },
          "latitude": {
            "type": [
              "number",
              "null"
            ],
            "minimum": -90,
            "maximum": 90,
            "description": "Absente (null) si le professionnel n'est pas géolocalisé."
          },
          "longitude": {
            "type": [
              "number",
              "null"
            ],
            "minimum": -180,
            "maximum": 180,
            "description": "Absente (null) si le professionnel n'est pas géolocalisé."
          },
          "distanceKm": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0,
            "description": "Distance à la position demandée, arrondie au dixième de km. null hors recherche par proximité."
          }
        }
      },
      "Slot": {
        "type": "object",
        "required": [
          "id",
          "professionalId",
          "startsAt",
          "endsAt"
        ],
        "properties": {
          "id": {
            "type": "integer"
          },
          "professionalId": {
            "type": "integer"
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          },
          "endsAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "BookingRequest": {
        "type": "object",
        "required": [
          "slotId"
        ],
        "properties": {
          "slotId": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "Appointment": {
        "type": "object",
        "required": [
          "id",
          "slotId",
          "professionalId",
          "professionalName",
          "status",
          "startsAt"
        ],
        "properties": {
          "id": {
            "type": "integer"
          },
          "slotId": {
            "type": "integer"
          },
          "professionalId": {
            "type": "integer"
          },
          "professionalName": {
            "type": "string"
          },
          "specialty": {
            "type": "string"
          },
          "address": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "CONFIRMED",
              "CANCELLED"
            ]
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Identity": {
        "type": "object",
        "required": [
          "id",
          "name",
          "email",
          "role"
        ],
        "properties": {
          "id": {
            "type": "integer"
          },
          "name": {
            "type": "string"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "role": {
            "type": "string"
          }
        }
      },
      "Problem": {
        "type": "object",
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "detail": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "errors": {
            "type": "array",
            "items": {
              "type": "object"
            }
          }
        }
      },
      "Notification": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer"
          },
          "message": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "History": {
        "type": "object",
        "properties": {
          "action": {
            "type": "string",
            "enum": [
              "CREATED",
              "RESCHEDULED",
              "CANCELLED"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Clinic": {
        "type": "object",
        "required": [
          "slug",
          "name",
          "city",
          "color"
        ],
        "properties": {
          "slug": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "color": {
            "type": "string",
            "pattern": "^#[0-9a-f]{6}$"
          }
        }
      },
      "ClinicStats": {
        "type": "object",
        "required": [
          "patients",
          "practitioners",
          "slots",
          "appointments"
        ],
        "properties": {
          "patients": {
            "type": "integer"
          },
          "practitioners": {
            "type": "integer"
          },
          "slots": {
            "type": "integer"
          },
          "appointments": {
            "type": "integer"
          }
        }
      },
      "ClinicLog": {
        "type": "object",
        "required": [
          "id",
          "action",
          "label",
          "appointmentId",
          "practitioner",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "integer"
          },
          "action": {
            "type": "string",
            "enum": [
              "CREATED",
              "RESCHEDULED",
              "CANCELLED",
              "IMPORTED"
            ]
          },
          "label": {
            "type": "string"
          },
          "appointmentId": {
            "type": "integer"
          },
          "practitioner": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "PlatformClinic": {
        "type": "object",
        "required": [
          "slug",
          "name",
          "city",
          "color",
          "practitioners",
          "appointments30d",
          "createdAt"
        ],
        "properties": {
          "slug": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "color": {
            "type": "string",
            "pattern": "^#[0-9a-f]{6}$"
          },
          "practitioners": {
            "type": "integer",
            "format": "int64"
          },
          "appointments30d": {
            "type": "integer",
            "format": "int64",
            "description": "Rendez-vous créés ces 30 derniers jours"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "PlatformEvent": {
        "type": "object",
        "required": [
          "id",
          "action",
          "label",
          "actorEmail",
          "clinicSlug",
          "clinicName",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "integer"
          },
          "action": {
            "type": "string",
            "enum": [
              "CLINIC_CREATED",
              "CLINIC_UPDATED",
              "CLINIC_LOGO_CHANGED"
            ]
          },
          "label": {
            "type": "string"
          },
          "actorEmail": {
            "type": "string"
          },
          "clinicSlug": {
            "type": "string"
          },
          "clinicName": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "NewClinic": {
        "type": "object",
        "required": [
          "slug",
          "name",
          "city",
          "color",
          "adminEmail"
        ],
        "properties": {
          "slug": {
            "type": "string",
            "maxLength": 40,
            "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$"
          },
          "name": {
            "type": "string",
            "maxLength": 120
          },
          "city": {
            "type": "string",
            "maxLength": 80
          },
          "address": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 160
          },
          "color": {
            "type": "string",
            "pattern": "^#[0-9a-fA-F]{6}$"
          },
          "adminEmail": {
            "type": "string",
            "format": "email",
            "maxLength": 254,
            "description": "Compte existant, rattaché au cabinet comme premier administrateur."
          }
        }
      },
      "ClinicChanges": {
        "type": "object",
        "required": [
          "name",
          "city",
          "color"
        ],
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 120
          },
          "city": {
            "type": "string",
            "maxLength": 80
          },
          "address": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 160
          },
          "color": {
            "type": "string",
            "pattern": "^#[0-9a-fA-F]{6}$"
          }
        }
      },
      "ClinicDetails": {
        "type": "object",
        "required": [
          "slug",
          "name",
          "city",
          "address",
          "color",
          "hasLogo"
        ],
        "properties": {
          "slug": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "address": {
            "type": [
              "string",
              "null"
            ]
          },
          "color": {
            "type": "string",
            "pattern": "^#[0-9a-f]{6}$"
          },
          "hasLogo": {
            "type": "boolean"
          }
        }
      }
    },
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "JSESSIONID"
      }
    },
    "parameters": {
      "Clinic": {
        "name": "X-Clinic",
        "in": "header",
        "required": true,
        "description": "Slug du cabinet courant. Le paramètre de requête clinic le remplace là où un en-tête ne peut pas être envoyé (flux d'événements, liens de téléchargement). Absent ou mal formé : 400. Cabinet inconnu ou dont la personne connectée n'est pas membre : 404.",
        "schema": {
          "type": "string",
          "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
          "maxLength": 40
        },
        "example": "cabinet-a"
      }
    }
  }
}
