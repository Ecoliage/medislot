{
  "openapi": "3.1.0",
  "info": {
    "title": "MediSlot",
    "version": "1.0.0",
    "description": "Contrat de la correction pédagogique. Session HttpOnly et CSRF pour les écritures. Données fictives. Chaque appel porte le cabinet courant dans l'en-tête X-Clinic, sauf /csrf, /login, /logout, /me, /platform/clinics et /clinics."
  },
  "servers": [
    {
      "url": "http://localhost:8088/api"
    }
  ],
  "paths": {
    "/professionals": {
      "get": {
        "summary": "Rechercher et paginer les professionnels, éventuellement autour d'une position",
        "responses": {
          "200": {
            "description": "Réponse réussie",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "items",
                    "page",
                    "size",
                    "total"
                  ],
                  "properties": {
                    "items": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Professional"
                      }
                    },
                    "page": {
                      "type": "integer"
                    },
                    "size": {
                      "type": "integer"
                    },
                    "total": {
                      "type": "integer"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Données invalides",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "city",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "specialty",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          },
          {
            "name": "size",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 50,
              "default": 6
            }
          },
          {
            "name": "lat",
            "in": "query",
            "description": "Latitude en degrés décimaux. Obligatoire avec lon.",
            "schema": {
              "type": "number",
              "minimum": -90,
              "maximum": 90
            }
          },
          {
            "name": "lon",
            "in": "query",
            "description": "Longitude en degrés décimaux. Obligatoire avec lat.",
            "schema": {
              "type": "number",
              "minimum": -180,
              "maximum": 180
            }
          },
          {
            "name": "radiusKm",
            "in": "query",
            "description": "Rayon de recherche en kilomètres, utilisé seulement avec lat et lon.",
            "schema": {
              "type": "number",
              "minimum": 0.1,
              "maximum": 50,
              "default": 5
            }
          }
        ],
        "description": "Sans lat ni lon, recherche textuelle (q, city, specialty) triée par nom puis id. Avec lat et lon, recherche par proximité : les professionnels situés dans le rayon sont triés par distance croissante, q et city sont alors ignorés, specialty reste appliqué, et la réponse porte Cache-Control: no-store. lat et lon vont toujours ensemble."
      },
      "parameters": [
        {
          "$ref": "#/components/parameters/Clinic"
        }
      ]
    },
