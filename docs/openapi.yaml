    "/appointments/{id}/convocation.pdf": {
      "get": {
        "summary": "Convocation du rendez-vous en PDF",
        "description": "Fabrique la convocation du rendez-vous du patient connecté. Aucun PDF n'est fabriqué pour un rendez-vous inconnu, d'un autre patient ou annulé. Le nom de fichier ne contient que le numéro du rendez-vous.",
        "parameters": [
          {
            "name": "download",
            "in": "query",
            "required": false,
            "schema": {
              "type": "boolean",
              "default": false
            },
            "description": "true : téléchargement (attachment) ; false : affichage dans le navigateur (inline)."
          }
        ],
        "responses": {
          "200": {
            "description": "Convocation PDF",
            "headers": {
              "Content-Disposition": {
                "description": "inline; filename=\"convocation-{id}.pdf\" par défaut, attachment; filename=\"convocation-{id}.pdf\" avec download=true.",
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "description": "no-store : document personnel, jamais mis en cache.",
                "schema": {
                  "type": "string",
                  "example": "no-store"
                }
              },
              "Content-Length": {
                "description": "Taille du PDF en octets.",
                "schema": {
                  "type": "integer"
                }
              }
            },
            "content": {
              "application/pdf": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "401": {
            "description": "Session requise",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "404": {
            "description": "Rendez-vous introuvable ou appartenant à un autre patient",
            "content": {
              "application/problem+json": {
                "schema": {
