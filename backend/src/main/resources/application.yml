server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/medislot}
    username: ${DB_USER:medislot}
    password: ${DB_PASSWORD:medislot-local-only}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
medislot:
  demo-seed: ${DEMO_SEED:true}
  export:
    aws-access-key-id: ${EXPORT_AWS_ACCESS_KEY_ID:}
  admin-password: ${ADMIN_PASSWORD:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  sms:
    url: ${SMS_URL:http://localhost:8089/sms}
